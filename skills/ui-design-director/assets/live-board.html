<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="check-site" content="comparison-board">
<meta name="description" content="참고 사이트를 실제로 띄워 넘겨 보는 화면">
<title>__TITLE__</title>
<style>
  :root { --bg: #1d1d1d; --bar: #2a2a2a; --line: #444; --text: #f2f2f2; --muted: #b5b5b5; --on: #ffffff; --phone-w: 390px; --phone-h: 844px; --pc-w: 1280px; --pc-h: 800px; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, "Malgun Gothic", sans-serif; word-break: keep-all; display: grid; grid-template-rows: 1fr auto; height: 100vh; }
  .stage { overflow: auto; display: grid; place-items: start center; padding: 16px; }
  .frame { border: 10px solid #000; border-radius: 28px; background: #fff; overflow: hidden; }
  .phone .frame { width: calc(var(--phone-w) + 20px); height: calc(var(--phone-h) + 20px); }
  .phone iframe { width: var(--phone-w); height: var(--phone-h); }
  .pc .frame { border-radius: 8px; width: calc(var(--pc-w) * var(--k) + 20px); height: calc(var(--pc-h) * var(--k) + 20px); }
  .pc iframe { width: var(--pc-w); height: var(--pc-h); transform: scale(var(--k)); transform-origin: 0 0; }
  iframe { border: 0; display: block; }
  .blocked { padding: 24px; color: #222; }
  .bar { background: var(--bar); border-top: 1px solid var(--line); padding: 10px 14px; display: grid; gap: 8px; }
  .now { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
  .now b { font-size: 17px; }
  .now span { color: var(--muted); font-size: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  button, .open { min-height: 44px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--text); font: inherit; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
  button[aria-pressed="true"] { background: var(--on); color: #111; border-color: var(--on); font-weight: 700; }
  button:focus-visible, .open:focus-visible { outline: 2px solid #f5c542; outline-offset: 2px; }
  .sep { width: 1px; height: 28px; background: var(--line); margin: 0 4px; }
</style>
</head>
<body>
<main class="stage phone" id="stage"><div class="frame" id="frame"></div></main>
<nav class="bar" aria-label="참고 사이트 고르기">
  <div class="now"><b id="name"></b><span id="meta"></span></div>
  <div class="row" id="cands"></div>
  <div class="row" id="pages"><span class="sep" aria-hidden="true"></span>
    <button type="button" id="v-phone" aria-pressed="true">휴대폰</button><button type="button" id="v-pc" aria-pressed="false">PC</button>
    <a class="open" id="open" target="_blank" rel="noopener">새 창으로 열기</a></div>
</nav>
<script type="application/json" id="data">
__DATA__
</script>
<script>
(function () {
  "use strict";
  var data = JSON.parse(document.getElementById("data").textContent);
  var st = { c: 0, p: 0, v: "phone" };
  var stage = document.getElementById("stage"), frame = document.getElementById("frame");
  var cands = document.getElementById("cands"), pages = document.getElementById("pages"), open = document.getElementById("open");
  data.forEach(function (d, i) {
    var b = document.createElement("button"); b.type = "button"; b.textContent = d.n + " " + d.name;
    b.addEventListener("click", function () { st.c = i; st.p = 0; draw(); });
    cands.appendChild(b);
  });
  function fit() {
    var k = Math.min(1, (stage.clientWidth - 52) / 1280, (stage.clientHeight - 52) / 800);
    stage.style.setProperty("--k", k.toFixed(3));
  }
  function draw() {
    var d = data[st.c], keys = Object.keys(d.pages), url = d.pages[keys[st.p]];
    document.getElementById("name").textContent = d.n + " " + d.name + " · " + keys[st.p];
    document.getElementById("meta").textContent = d.meta;
    [].forEach.call(cands.children, function (b, i) { b.setAttribute("aria-pressed", String(i === st.c)); });
    [].slice.call(pages.querySelectorAll(".pg")).forEach(function (b) { b.remove(); });
    keys.slice().reverse().forEach(function (k) {
      var i = keys.indexOf(k);
      var b = document.createElement("button"); b.type = "button"; b.className = "pg"; b.textContent = k;
      b.setAttribute("aria-pressed", String(i === st.p));
      b.addEventListener("click", function () { st.p = i; draw(); });
      pages.insertBefore(b, pages.firstChild);
    });
    stage.className = "stage " + st.v;
    document.getElementById("v-phone").setAttribute("aria-pressed", String(st.v === "phone"));
    document.getElementById("v-pc").setAttribute("aria-pressed", String(st.v === "pc"));
    open.href = url;
    frame.textContent = "";
    if (d.blocked && d.shot) {
      var im = document.createElement("img"); im.src = d.shot; im.alt = d.name + " 첫 화면"; im.style.width = "100%";
      frame.style.overflow = "auto"; frame.appendChild(im);
    } else if (d.blocked) {
      var p = document.createElement("p"); p.className = "blocked"; p.textContent = "이 사이트는 다른 페이지 안에 띄울 수 없어요. 아래 「새 창으로 열기」를 눌러 주세요.";
      frame.appendChild(p);
    } else {
      var f = document.createElement("iframe"); f.src = url; f.title = d.name + " " + keys[st.p]; f.loading = "lazy";
      frame.appendChild(f);
    }
    fit();
  }
  document.getElementById("v-phone").addEventListener("click", function () { st.v = "phone"; draw(); });
  document.getElementById("v-pc").addEventListener("click", function () { st.v = "pc"; draw(); });
  addEventListener("resize", fit);
  addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight") { st.c = (st.c + 1) % data.length; st.p = 0; draw(); }
    if (e.key === "ArrowLeft") { st.c = (st.c - 1 + data.length) % data.length; st.p = 0; draw(); }
  });
  draw();
})();
</script>
</body>
</html>
